name: 本免学科試験キャンセル監視

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "デバッグモード(artifacts保存)を有効にするか"
        type: boolean
        default: false
      venue:
        description: "チェックする試験場(空なら全試験場)"
        type: string
        default: ""
      months_ahead:
        description: "何ヶ月先まで見るか(空なら3)"
        type: string
        default: ""
      test_notify:
        description: "通知のテスト(サイトにはアクセスしない)"
        type: boolean
        default: false

permissions:
  contents: write

# concurrency は意図的に設定しない。
# グループを設定すると、実行が2分を超えたときに後続の待機中リクエストが
# キャンセルされ、そのサイクルのチェックが丸ごと飛んでしまうため。

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DEBUG: ${{ github.event.inputs.debug == 'true' && '1' || '0' }}
          TARGET_VENUE: ${{ github.event.inputs.venue }}
          MONTHS_AHEAD: ${{ github.event.inputs.months_ahead }}
          TEST_NOTIFY: ${{ github.event.inputs.test_notify == 'true' && '1' || '0' }}
          STATE_FILE: ${{ github.event.inputs.venue && format('state_{0}.json', github.event.inputs.venue) || 'state.json' }}
        run: python scraper.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit updated state and history
        if: always()
        run: |
          git config user.name "license-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: update state/history [skip ci]"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "push succeeded"
                break
              fi
              echo "push failed, retrying after pulling latest ($i)"
              git pull --rebase origin main || true
              sleep 3
            done
          fi
