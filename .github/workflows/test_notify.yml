name: ntfy通知テスト

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send test ntfy message
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python test_notify.py
